#:schema https://secretspec.dev/schema/secretspec.schema.json
# Vendor keys for live Runs and the eval harness. Never needed by tests or CI.
# The devenv shell exports them on entry (devenv.nix `enterShell`; see README "Vendor keys").
# Optional, so the shell opens without them; a Run names the key it is missing.

[project]
name = "iconograph"
revision = "1.0"

# Vault "Iconograph" in the maintainer's 1Password account `my.1password.com`. Each key is a
# Secure Note `secretspec/iconograph/default/<KEY>`.
# Reads use `onepassword_service`, a read-only service account (no Touch ID, so unattended shells
# get the keys too); its token lives in the macOS Keychain
# (`secretspec config provider login onepassword_service`). `onepassword` reads the same vault as
# you, through the desktop app (`op --account my.1password.com`, Touch ID), e.g.
# `secretspec check --provider onepassword`. Adding a key: README "Vendor keys".
# Use another store with `--provider`, e.g. `SECRETSPEC_PROVIDER=keyring devenv shell`.
[providers]
keyring = "keyring://"
onepassword_service = { uri = "onepassword+token://Iconograph", credentials = { service_account_token = "keyring" } }
onepassword = "onepassword://my.1password.com@Iconograph"

[defaults]
providers = ["onepassword_service"]

[profiles.default.defaults]
required = false

[profiles.default]
ANTHROPIC_API_KEY = { description = "Anthropic: the default Judge and Optimizer (anthropic/claude-sonnet-5-5)" }
OPENAI_API_KEY = { description = "OpenAI: OpenAI Lanes and the eval harness's default second Judge (openai/gpt-5.5)" }
GEMINI_API_KEY = { description = "Google Gemini: Gemini Lanes" }
GOOGLE_GENERATIVE_AI_API_KEY = { description = "Google Gemini key as read by a google/ Judge or Optimizer", composed = "${GEMINI_API_KEY}" }
