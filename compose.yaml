# One service, one data volume (ADR-0005, ADR-0012). Copy .env.example to .env first.
name: iconograph
services:
  iconograph:
    image: ghcr.io/stibbons-ai/iconograph:latest
    build: .
    # Vendor API keys only. Compose gives `environment:` precedence over `env_file:`, and both
    # over the image's ENV, so a .env line can't change the settings below.
    env_file: .env
    environment:
      # Pinned (the image sets the same): ICONOGRAPH_HOST/PORT must match the published port
      # below and DATA_DIR the volume, or the container would be unreachable or lose its data.
      # The server listens on every interface inside the container; the port is published on
      # the host's loopback only, so nothing else on the network can reach it (ADR-0012).
      ICONOGRAPH_HOST: 0.0.0.0
      ICONOGRAPH_PORT: "4111"
      ICONOGRAPH_DATA_DIR: /data
      # Pinned so .env can't turn telemetry on (ADR-0005).
      MASTRA_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    ports:
      - "127.0.0.1:4111:4111"
    volumes:
      - iconograph-data:/data
    # Health: the image's HEALTHCHECK (bun runs /app/healthcheck.js against /health; distroless
    # has no shell or curl), with a 5 min start period for the first start's 38.9 MB download.
    restart: unless-stopped

volumes:
  iconograph-data:
